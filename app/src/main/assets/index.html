<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kochideen</title>
<style>
:root{
  --green:#1F3B2D; --green-2:#2E5641; --cream:#F6F1E7; --paper:#FFFCF6;
  --ink:#1D2420; --muted:#6B7169; --line:#E6DDCC;
  --tomato:#E0603A; --tomato-2:#C94E2A; --saffron:#E9B44C; --leaf:#7FA36B;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);
  font-family:system-ui,-apple-system,"Roboto",sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3{font-family:"Noto Serif",Georgia,serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* Kopfzeile */
header{background:var(--green);color:var(--cream);padding:18px 20px 22px;position:relative}
header .kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--saffron);font-weight:600}
header h1{font-size:1.65rem;margin-top:2px}
header p{margin:6px 0 0;color:#CFD8CF;font-size:.92rem}
header .back{position:absolute;right:14px;top:16px;color:var(--cream);font-size:.9rem;
  padding:6px 12px;border:1px solid rgba(246,241,231,.35);border-radius:999px}

main{padding:16px 16px 150px;max-width:640px;margin:0 auto}
.section{margin-top:22px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.section-title h2{font-size:1.15rem}
.section-title .meta{font-size:.82rem;color:var(--muted)}
.hint{font-size:.88rem;color:var(--muted);margin:4px 0 0}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;
  font-weight:600;transition:transform .08s ease, background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--tomato);color:#fff}
.btn-primary:active{background:var(--tomato-2)}
.btn-primary[disabled]{background:#D9CFC0;color:#fff}
.btn-dark{background:var(--green);color:var(--cream)}
.btn-ghost{background:var(--paper);border:1.5px solid var(--line)}
.btn-small{padding:8px 12px;font-size:.88rem;border-radius:10px}
.link{color:var(--tomato-2);font-weight:600;font-size:.9rem;padding:4px 0}

.capture{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:-2px}
.capture label{cursor:pointer}
.capture .big{flex-direction:column;padding:18px 10px;font-size:1rem}
.capture .big .ico{font-size:1.8rem;line-height:1}
input[type=file]{display:none}

/* Fotos */
.photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.photo{flex:0 0 auto;width:88px;height:88px;border-radius:14px;position:relative;overflow:hidden;
  background:#E8E0D2 center/cover no-repeat}
.photo .badge{position:absolute;left:6px;bottom:6px;background:rgba(31,59,45,.88);color:#fff;
  font-size:.72rem;padding:2px 7px;border-radius:999px}
.photo.err .badge{background:var(--tomato-2)}
.photo .spin{position:absolute;inset:0;display:grid;place-items:center;background:rgba(31,59,45,.45)}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Zutaten-Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);
  border-radius:999px;padding:6px 6px 6px 12px;font-size:.93rem;animation:pop .2s ease}
.chip .x{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--muted);
  background:#F0E9DC;font-size:.9rem}
.chip.spice{padding:6px 12px;background:transparent;border-style:dashed;color:var(--muted)}
.chip.basis{border-color:var(--leaf)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:.93rem}

.add-row{display:flex;gap:8px;margin-top:12px}
.field{flex:1;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;width:100%}
.field:focus{border-color:var(--green-2)}

/* Basis-Zutaten */
.grid-check{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);
  border-radius:12px;padding:11px 12px;font-size:.95rem;user-select:none}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid #C9BDA8;display:grid;place-items:center;
  flex:0 0 auto;color:#fff;font-size:.8rem;transition:all .15s}
.check.on{border-color:var(--green-2);background:#EEF3EC}
.check.on .box{background:var(--green-2);border-color:var(--green-2)}

.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.opt-row + .opt-row{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;background:#F0E9DC;font-size:1.1rem;font-weight:700}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.seg{display:flex;background:#F0E9DC;border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* Rezeptkarten */
.recipe{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;animation:pop .25s ease}
.recipe .top{display:flex;gap:12px;align-items:flex-start}
.recipe .emo{font-size:2rem;width:52px;height:52px;border-radius:14px;background:#F3ECDF;display:grid;place-items:center;flex:0 0 auto}
.recipe h3{font-size:1.1rem;line-height:1.25}
.recipe .art{font-size:.78rem;color:var(--tomato-2);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.recipe p{margin:8px 0 0;font-size:.92rem;color:#454B45}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fact{font-size:.8rem;background:#F3ECDF;border-radius:8px;padding:4px 8px;font-weight:600;color:#4A4F48}
.fact.warn{background:#FCE6DD;color:var(--tomato-2)}
.recipe .heart{position:absolute;right:14px;top:14px;font-size:1.2rem}

/* Detail */
.hero{background:var(--green);color:var(--cream);margin:-16px -16px 0;padding:6px 20px 24px}
.hero .emo{font-size:2.6rem}
.hero h2{font-size:1.55rem;line-height:1.2;margin-top:4px}
.hero p{color:#CFD8CF;margin:8px 0 0;font-size:.95rem}
.hero .facts .fact{background:rgba(246,241,231,.12);color:var(--cream)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.time b{display:block;font-size:1.25rem;font-family:"Noto Serif",Georgia,serif}
.time span{font-size:.75rem;color:var(--muted)}
.nutri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nutri .n{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px}
.nutri .n.main{grid-column:span 3;display:flex;align-items:center;justify-content:space-between;background:#FFF3E9;border-color:#F3D5C2}
.nutri .n b{font-size:1.15rem;font-family:"Noto Serif",Georgia,serif;display:block}
.nutri .n.main b{font-size:1.7rem;color:var(--tomato-2)}
.nutri .n span{font-size:.76rem;color:var(--muted)}
.macro{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-top:10px;background:#EEE}
.macro i{display:block;height:100%}
.legend{display:flex;gap:14px;margin-top:6px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.ing-list{list-style:none;margin:0;padding:0}
.ing-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.ing-list li:last-child{border-bottom:0}
.ing-list .amt{color:var(--muted);font-size:.9rem;white-space:nowrap}
.tag{font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.tag.gewuerz{background:#EFE7D6;color:#8A6D2F}
.tag.fehlt{background:#FCE6DD;color:var(--tomato-2)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 44px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;
  background:var(--green);color:var(--cream);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.tip{background:#FFF7E2;border:1.5px solid #F1DFAE;border-radius:14px;padding:12px 14px;font-size:.93rem}

/* Laden */
.loading{text-align:center;padding:50px 20px}
.pot{font-size:3.4rem;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.loading h3{margin-top:12px;font-size:1.2rem}
.loading p{color:var(--muted);font-size:.92rem}

/* Aktionsleiste unten */
.actionbar{position:fixed;left:0;right:0;bottom:64px;padding:12px 16px;
  background:linear-gradient(to top, var(--cream) 70%, rgba(246,241,231,0));z-index:5}
.actionbar .inner{max-width:640px;margin:0 auto;display:flex;gap:10px}
.actionbar .btn{flex:1}

nav.tabs{position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--paper);border-top:1px solid var(--line);
  display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:.74rem;color:var(--muted);font-weight:600}
nav.tabs button .i{font-size:1.25rem;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--green)}
nav.tabs button.on .i{filter:none;opacity:1}
nav.tabs .count{background:var(--tomato);color:#fff;border-radius:999px;font-size:.65rem;padding:0 5px;margin-left:2px}

.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;transition:all .25s;z-index:20;max-width:88%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.notice{background:#FFF3E9;border:1.5px solid #F3D5C2;border-radius:14px;padding:12px 14px;font-size:.9rem;margin-top:14px}
.err-box{background:#FCE6DD;border:1.5px solid #F0B9A4;border-radius:14px;padding:14px;font-size:.92rem;color:#7A2E17}
label.lbl{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}
.radio{display:flex;align-items:flex-start;gap:10px;padding:10px 0}
.radio input{margin-top:4px;accent-color:var(--green)}
.radio small{display:block;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>

<input type="file" id="camInput" accept="image/*" capture="environment">
<input type="file" id="galInput" accept="image/*" multiple>

<script>
"use strict";
/* ---------- Grundlagen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");

/* Gewürze werden als vorhanden angenommen */
const SPICES = ["Salz","Pfeffer","Paprikapulver","Chiliflocken","Currypulver","Kreuzkümmel","Oregano",
  "Basilikum (getrocknet)","Thymian","Rosmarin","Petersilie (getrocknet)","Muskatnuss","Zimt","Lorbeerblatt","Knoblauchpulver","Zucker (zum Würzen)"];

/* Häufige Basis-Zutaten, nach denen gefragt wird */
const STAPLES = [
  ["Eier","🥚"],["Butter","🧈"],["Milch","🥛"],["Sahne","🥛"],["Mehl","🌾"],["Zucker","🍬"],
  ["Speiseöl","🫒"],["Olivenöl","🫒"],["Zwiebeln","🧅"],["Knoblauch","🧄"],["Nudeln","🍝"],["Reis","🍚"],
  ["Kartoffeln","🥔"],["Reibekäse","🧀"],["Tomatenmark","🍅"],["Dosentomaten","🥫"],["Gemüsebrühe","🥣"],
  ["Senf","🟡"],["Essig","🍶"],["Zitrone","🍋"],["Honig","🍯"],["Semmelbrösel","🍞"],["Joghurt","🥛"],["Toastbrot","🍞"]
];

const CAT_EMOJI = {gemuese:"🥕",obst:"🍎",fleisch:"🥩",fisch:"🐟",milch:"🥛",kaese:"🧀",ei:"🥚",getreide:"🌾",
  huelsenfruechte:"🫘",konserve:"🥫",gewuerz:"🧂",sauce:"🫙",nuss:"🥜",backen:"🧁",getraenk:"🧃",kraeuter:"🌿",sonstiges:"🍽️",basis:"✔️"};

const MODELS = [
  ["gemini-flash-latest","Google Gemini Flash","Empfohlen – kostenlos, gute Fotoerkennung","gemini"],
  ["gemini-flash-lite-latest","Google Gemini Flash-Lite","Kostenlos, schneller, mehr Anfragen pro Tag","gemini"],
  ["claude-sonnet-5-5","Claude Sonnet 5.5","Kostenpflichtig (ca. 1–3 Cent pro Anfrage)","claude"],
  ["claude-haiku-5-5","Claude Haiku 5.5","Kostenpflichtig, günstiger","claude"]
];
const providerOf = m => (MODELS.find(x => x[0] === m) || MODELS[0])[3];

/* ---------- Zustand ---------- */
const S = {
  view: "scan",
  tab: "cook",
  history: [],
  ingredients: store.get("ingredients", []),          // {id,name,cat,src}
  photos: [],                                           // {id,thumb,status,found,added,error}
  staples: new Set(store.get("staples", [])),
  recipes: store.get("lastRecipes", []),
  saved: store.get("saved", []),
  settings: (() => {
    const st = Object.assign({model:"gemini-flash-latest", keys:{gemini:"", claude:""}, servings:2, count:4, wish:""}, store.get("settings", {}));
    st.keys = Object.assign({gemini:"", claude:""}, st.keys || {});
    if (st.apiKey){ if (st.apiKey.toLowerCase() === "demo") st.keys.gemini = "demo"; else st.keys.claude = st.apiKey; delete st.apiKey; }
    if (!MODELS.some(x => x[0] === st.model)) st.model = "gemini-flash-latest";
    return st;
  })(),
  current: null,
  loading: false,
  error: ""
};
const persist = () => {
  store.set("ingredients", S.ingredients);
  store.set("staples", [...S.staples]);
  store.set("lastRecipes", S.recipes);
  store.set("saved", S.saved);
  store.set("settings", S.settings);
};

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- Navigation ---------- */
function go(view, push = true){
  if (push && S.view !== view) S.history.push(S.view);
  S.view = view; render(); window.scrollTo(0, 0);
}
function tab(view, t){ S.history = []; S.view = view; S.tab = t || ({scan:"cook",staples:"cook",results:"ideas",saved:"saved",settings:"settings"}[view]) || S.tab; render(); window.scrollTo(0, 0); }
window.handleBack = function(){
  if (S.history.length){ S.view = S.history.pop(); render(); window.scrollTo(0,0); return true; }
  if (S.view !== "scan"){ S.view = "scan"; S.tab = "cook"; render(); return true; }
  return false;
};

/* ---------- KI-Anbindung (Gemini kostenlos / Claude optional) ---------- */
const pending = {};
window.__nativeResp = function(id, status, b64){
  const p = pending[id]; if (!p) return; delete pending[id];
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  p.resolve({status, text: new TextDecoder("utf-8").decode(bytes)});
};
const curKey = () => (S.settings.keys[providerOf(S.settings.model)] || "").trim();

async function httpPost(url, headers, body){
  if (window.Android && window.Android.post){
    const id = uid();
    return new Promise(resolve => { pending[id] = {resolve}; window.Android.post(id, url, JSON.stringify(headers), JSON.stringify(body)); });
  }
  // Fallback für Test im Browser
  try {
    const r = await fetch(url, {method:"POST", headers, body: JSON.stringify(body)});
    return {status: r.status, text: await r.text()};
  } catch(e){ return {status:0, text: JSON.stringify({error:{message:"Keine Verbindung: " + e.message}})}; }
}

/* parts: [{image:"<base64 jpeg>"}, {text:"..."}] – liefert den Antworttext */
async function askAIText(parts, maxTokens){
  const key = curKey();
  if (!key) throw new Error("Bitte zuerst in den Einstellungen deinen kostenlosen API-Schlüssel eintragen.");
  const model = S.settings.model, prov = providerOf(model);
  let res;
  if (prov === "gemini"){
    res = await httpPost(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
      {"content-type":"application/json", "x-goog-api-key": key},
      {contents:[{role:"user", parts: parts.map(p => p.image ? {inline_data:{mime_type:"image/jpeg", data:p.image}} : {text:p.text})}],
       generationConfig:{responseMimeType:"application/json", maxOutputTokens: Math.max(8192, maxTokens * 2), temperature: 0.8}});
  } else {
    res = await httpPost("https://api.anthropic.com/v1/messages",
      {"content-type":"application/json", "x-api-key": key, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
      {model, max_tokens: maxTokens, messages:[{role:"user", content: parts.map(p => p.image
        ? {type:"image", source:{type:"base64", media_type:"image/jpeg", data:p.image}} : {type:"text", text:p.text})}]});
  }
  let data; try { data = JSON.parse(res.text); } catch(e){ data = null; }
  if (res.status !== 200){
    const msg = data && data.error && data.error.message ? data.error.message : ("Fehler " + res.status);
    if (res.status === 401 || res.status === 403 || /api key not valid|API_KEY_INVALID/i.test(msg))
      throw new Error("API-Schlüssel ungültig. Bitte in den Einstellungen prüfen.");
    if (res.status === 429) throw new Error(prov === "gemini"
      ? "Kostenloses Kontingent gerade aufgebraucht. Bitte eine Minute warten (oder morgen wieder) bzw. in den Einstellungen „Flash-Lite“ wählen."
      : "Zu viele Anfragen – bitte kurz warten.");
    if (res.status === 503 || res.status === 529) throw new Error("Der Dienst ist gerade überlastet. Bitte gleich nochmal versuchen.");
    throw new Error(msg);
  }
  if (prov === "gemini"){
    const c = data.candidates && data.candidates[0];
    const text = c && c.content && c.content.parts ? c.content.parts.filter(p => !p.thought && p.text).map(p => p.text).join("") : "";
    if (!text) throw new Error(c && c.finishReason === "MAX_TOKENS" ? "Antwort war zu lang – bitte weniger Ideen wählen." : "Keine Antwort erhalten. Bitte nochmal versuchen.");
    return text;
  }
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
}
const askAI = async (parts, maxTokens) => parseJSON(await askAIText(parts, maxTokens));

function parseJSON(text){
  let t = text.replace(/```json|```/g, "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < 0) throw new Error("Unerwartete Antwort erhalten. Bitte nochmal versuchen.");
  try { return JSON.parse(t.slice(a, b + 1)); }
  catch(e){ throw new Error("Antwort konnte nicht gelesen werden. Bitte nochmal versuchen."); }
}

const isDemo = () => curKey().toLowerCase() === "demo";

/* ---------- Fotos ---------- */
function resizeImage(file, max){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      const full = c.toDataURL("image/jpeg", 0.82);
      const ts = 180 / Math.max(w, h);
      const c2 = document.createElement("canvas"); c2.width = Math.round(w*ts); c2.height = Math.round(h*ts);
      c2.getContext("2d").drawImage(c, 0, 0, c2.width, c2.height);
      URL.revokeObjectURL(url);
      resolve({full, thumb: c2.toDataURL("image/jpeg", 0.7)});
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Foto konnte nicht geladen werden")); };
    img.src = url;
  });
}

const DETECT_PROMPT = `Du siehst ein Foto aus einer Küche (z. B. Kühlschrank, Vorratsschrank, Arbeitsfläche oder einzelne Lebensmittel).
Liste ALLE erkennbaren Lebensmittel und Kochzutaten auf.
Regeln:
- Deutsche, kurze, allgemeine Namen im Singular oder üblicher Form (z. B. "Paprika rot", "Hähnchenbrust", "Gouda", "Champignons").
- Keine Marken, keine Mengen, keine Geräte, kein Geschirr.
- Bei Verpackungen den Inhalt nennen, wenn er eindeutig erkennbar ist.
- Nur nennen, was du wirklich siehst – nichts raten.
Antworte AUSSCHLIESSLICH mit JSON in genau diesem Format:
{"zutaten":[{"name":"...","kategorie":"gemuese|obst|fleisch|fisch|milch|kaese|ei|getreide|huelsenfruechte|konserve|gewuerz|kraeuter|sauce|nuss|backen|getraenk|sonstiges"}]}
Wenn nichts erkennbar ist: {"zutaten":[]}`;

async function detectIngredients(dataUrl){
  if (isDemo()){
    await new Promise(r => setTimeout(r, 1200));
    const pool = [["Tomaten","gemuese"],["Zucchini","gemuese"],["Paprika rot","gemuese"],["Hähnchenbrust","fleisch"],
      ["Feta","kaese"],["Spinat","gemuese"],["Champignons","gemuese"],["Mozzarella","kaese"],["Kichererbsen","huelsenfruechte"],["Frühlingszwiebeln","gemuese"]];
    return pool.sort(() => Math.random() - .5).slice(0, 4).map(([name, kategorie]) => ({name, kategorie}));
  }
  const data = dataUrl.split(",")[1];
  const r = await askAI([{image: data}, {text: DETECT_PROMPT}], 2000);
  return Array.isArray(r.zutaten) ? r.zutaten.filter(z => z && z.name) : [];
}

function hasIngredient(name){
  const n = norm(name);
  return S.ingredients.some(i => norm(i.name) === n);
}
function addIngredient(name, cat, src){
  name = String(name).trim(); if (!name || hasIngredient(name)) return false;
  S.ingredients.push({id: uid(), name: name.charAt(0).toUpperCase() + name.slice(1), cat: cat || "sonstiges", src});
  return true;
}

async function handleFiles(files){
  files = [...files].filter(f => f.type.startsWith("image/") || !f.type);
  for (const f of files) processPhoto(f);
}
async function processPhoto(file){
  const p = {id: uid(), thumb: "", status: "loading"};
  S.photos.push(p); updateScan();
  try {
    const {full, thumb} = await resizeImage(file, 1280);
    p.thumb = thumb; updateScan();
    const found = await detectIngredients(full);
    let added = 0;
    for (const z of found) if (addIngredient(z.name, z.kategorie, "foto")) added++;
    p.status = "done"; p.found = found.length; p.added = added;
    persist();
    toast(found.length ? `${found.length} Zutat${found.length === 1 ? "" : "en"} erkannt` : "Auf diesem Foto wurde nichts erkannt");
  } catch(e){
    p.status = "error"; p.error = e.message; toast(e.message);
  }
  updateScan();
}

function recipePrompt(more){
  const s = S.settings;
  const staples = availableStaples().map(([n]) => n).filter(n => S.staples.has(n));
  const list = [...S.ingredients.map(i => i.name), ...staples];
  const avoid = more ? S.recipes.map(r => r.titel) : [];
  return `Du bist ein kreativer, praxisnaher Hobbykoch-Coach. Erstelle ${s.count} unterschiedliche Rezeptideen auf Deutsch.

VERFÜGBARE ZUTATEN:
${list.map(x => "- " + x).join("\n")}

GEWÜRZE & GETROCKNETE KRÄUTER (immer vorhanden): ${SPICES.join(", ")}
Außerdem immer vorhanden: Wasser.

PORTIONEN: ${s.servings}
${s.wish.trim() ? "WÜNSCHE: " + s.wish.trim() : ""}
${avoid.length ? "Diese Gerichte wurden schon vorgeschlagen, bitte NICHT wiederholen: " + avoid.join("; ") : ""}

REGELN:
- Verwende hauptsächlich die verfügbaren Zutaten. Nicht jede Zutat muss in jedem Rezept vorkommen.
- Pro Rezept darf höchstens EINE kleine, nicht vorhandene Zutat vorkommen (typ "fehlt"). Besser gar keine.
- Verwendete Gewürze/Kräuter MÜSSEN in der Zutatenliste stehen (mit Menge, z. B. "1 TL", "1 Prise"), typ "gewuerz".
- Alle anderen verwendeten Zutaten: typ "vorhanden". Mengen für ${s.servings} Portion(en).
- Abwechslung bei der Art (z. B. Pfanne, Ofen, Suppe, Salat, Pasta, Bowl, Frühstück, Snack) – passend zu den Zutaten.
- Klare, nummerierbare Schritte, jeder Schritt ein bis zwei Sätze.
- Nährwerte PRO PORTION realistisch schätzen (ganze Zahlen). Zeiten realistisch in Minuten.

Antworte AUSSCHLIESSLICH mit gültigem JSON ohne Markdown, genau in diesem Format:
{"rezepte":[{"titel":"","beschreibung":"1–2 appetitliche Sätze","art":"z. B. Pfannengericht","emoji":"ein passendes Emoji","schwierigkeit":"leicht|mittel|anspruchsvoll","zeit":{"vorbereitung":10,"kochen":20,"gesamt":30},"portionen":${s.servings},"naehrwerte_pro_portion":{"kcal":0,"eiweiss_g":0,"kohlenhydrate_g":0,"zucker_g":0,"fett_g":0,"gesaettigte_fettsaeuren_g":0,"ballaststoffe_g":0},"zutaten":[{"name":"","menge":"","typ":"vorhanden|gewuerz|fehlt"}],"schritte":[""],"tipp":"ein kurzer Profi-Tipp"}]}`;
}

window.generate = async function(more){
  S.loading = true; S.error = "";
  if (!more) S.recipes = [];
  S.tab = "ideas";
  go("results", S.view !== "results");
  try {
    let list;
    if (isDemo()){ await new Promise(r => setTimeout(r, 1800)); list = demoRecipes(); }
    else {
      const r = await askAI([{text: recipePrompt(more)}], Math.min(16000, 1800 * S.settings.count + 1500));
      list = Array.isArray(r.rezepte) ? r.rezepte : [];
    }
    list.forEach(x => x.id = uid());
    if (!list.length) throw new Error("Es kamen keine Rezepte zurück. Bitte nochmal versuchen.");
    S.recipes = more ? [...S.recipes, ...list] : list;
  } catch(e){ S.error = e.message; }
  S.loading = false; persist();
  if (S.view === "results") render();
};

}

      <ol class="steps">${(r.schritte || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    </div>

    ${r.tipp ? `<div class="section tip">💡 <b>Tipp:</b> ${esc(r.tipp)}</div>` : ""}
  </main>
  <div class="actionbar"><div class="inner">
    <button class="btn ${isSaved(r.id) ? "btn-ghost" : "btn-primary"}" onclick="toggleSave()">${isSaved(r.id) ? "❤️ Gespeichert – entfernen" : "🤍 Rezept speichern"}</button>
  </div></div>`;
}
window.toggleSave = () => {
  const r = S.current; if (!r) return;
  if (isSaved(r.id)){ S.saved = S.saved.filter(x => x.id !== r.id); toast("Aus deinen Rezepten entfernt"); }
  else { S.saved.unshift(Object.assign({}, r, {savedAt: Date.now()})); toast("Rezept gespeichert ❤️"); }
  persist(); render();
};

function viewSaved(){
  return header("Rezeptbuch", "Gespeicherte Rezepte", S.saved.length ? `${S.saved.length} Rezept${S.saved.length > 1 ? "e" : ""}` : "") +
  `<main><div class="section">${S.saved.length ? S.saved.map(r => recipeCard(r, "saved")).join("")
    : `<div class="empty">Noch nichts gespeichert.<br>Öffne ein Rezept und tippe auf „Rezept speichern“.</div>`}</div></main>`;
}

function viewSettings(){
  const s = S.settings, prov = providerOf(s.model);
  const keyBox = prov === "gemini" ? `
      <label class="lbl" for="key">Google Gemini API-Schlüssel <span class="tag gewuerz">kostenlos</span></label>
      <div class="add-row" style="margin-top:0">
        <input class="field" id="key" type="password" value="${esc(s.keys.gemini)}" placeholder="AIza…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn btn-ghost btn-small" onclick="const k=$('#key');k.type=k.type==='password'?'text':'password'">👁</button>
      </div>
      <ol class="hint" style="padding-left:18px;margin:10px 0 0">
        <li>Öffne <a href="https://aistudio.google.com/apikey">aistudio.google.com/apikey</a> und melde dich mit deinem Google-Konto an.</li>
        <li>Tippe auf <b>„API-Schlüssel erstellen“</b> (keine Kreditkarte nötig).</li>
        <li>Schlüssel kopieren und hier einfügen.</li>
      </ol>
      <p class="hint">Der Schlüssel wird nur auf diesem Handy gespeichert. Zum Ausprobieren ohne Schlüssel einfach <b>demo</b> eintragen.</p>`
    : `
      <label class="lbl" for="key">Claude API-Schlüssel <span class="tag fehlt">kostenpflichtig</span></label>
      <div class="add-row" style="margin-top:0">
        <input class="field" id="key" type="password" value="${esc(s.keys.claude)}" placeholder="sk-ant-…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn btn-ghost btn-small" onclick="const k=$('#key');k.type=k.type==='password'?'text':'password'">👁</button>
      </div>
      <p class="hint">Schlüssel unter <a href="https://console.anthropic.com/settings/keys">console.anthropic.com</a> (Guthaben nötig).</p>`;
  return header("Einstellungen", "Einstellungen", "KI-Dienst und Schlüssel") +
  `<main>
    <div class="section card">
      <label class="lbl">KI-Modell</label>
      ${MODELS.map(([id, name, d]) => `<label class="radio"><input type="radio" name="model" ${s.model === id ? "checked" : ""} onchange="setModel('${id}')">
        <span><b>${name}</b><small>${d}</small></span></label>`).join("")}
    </div>

    <div class="section card">
      ${keyBox}
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-dark" style="flex:1" onclick="saveKey()">Speichern</button>
        <button class="btn btn-ghost" style="flex:1" onclick="testKey()" id="testBtn">Verbindung testen</button>
      </div>
    </div>

    <div class="section card">
      <label class="lbl">Daten</label>
      <p class="hint" style="margin-top:0">Gespeicherte Rezepte: ${S.saved.length}</p>
      <button class="link" onclick="if(confirm('Alle gespeicherten Rezepte löschen?')){S.saved=[];persist();render();}">Gespeicherte Rezepte löschen</button>
    </div>
  </main>`;
}
window.setModel = id => { S.settings.model = id; persist(); render(); toast("Modell gespeichert"); };
window.saveKey = () => { S.settings.keys[providerOf(S.settings.model)] = $("#key").value.trim(); persist(); toast("Gespeichert"); };
window.testKey = async () => {
  saveKey();
  const b = $("#testBtn"); b.textContent = "Teste …"; b.disabled = true;
  try {
    if (isDemo()) toast("Demo-Modus aktiv ✓");
    else {
      const r = await askAI([{text:'Antworte nur mit diesem JSON: {"ok":true}'}], 50);
      toast(r && r.ok ? "Verbindung klappt ✓" : "Antwort erhalten ✓");
    }
  } catch(e){ toast(e.message); }
  finally { b.textContent = "Verbindung testen"; b.disabled = false; }
};

/* ---------- Rendern ---------- */
const VIEWS = {scan: viewScan, staples: viewStaples, results: viewResults, detail: viewDetail, saved: viewSaved, settings: viewSettings};
function render(){
  $("#app").innerHTML = VIEWS[S.view]();
  const t = S.tab;
  $("#tabs").innerHTML = `
    <button class="${t === "cook" ? "on" : ""}" onclick="tab('scan','cook')"><span class="i">🥕</span>Kochen</button>
    ${S.recipes.length || S.loading ? `<button class="${t === "ideas" ? "on" : ""}" onclick="tab('results','ideas')"><span class="i">📋</span>Ideen</button>` : ""}
    <button class="${t === "saved" ? "on" : ""}" onclick="tab('saved','saved')"><span class="i">❤️</span>Gespeichert${S.saved.length ? `<span class="count">${S.saved.length}</span>` : ""}</button>
    <button class="${t === "settings" ? "on" : ""}" onclick="tab('settings','settings')"><span class="i">⚙️</span>Einstellungen</button>`;
  if (S.view === "scan"){
    updateScan();
    const m = $("#manual"); if (m) m.addEventListener("keydown", e => { if (e.key === "Enter") addManual(); });
  }
}

$("#camInput").addEventListener("change", e => { handleFiles(e.target.files); e.target.value = ""; });
$("#galInput").addEventListener("change", e => { handleFiles(e.target.files); e.target.value = ""; });
render();
</script>
</body>
</html>
